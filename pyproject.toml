[project]
name = "curiosity-on-demand"
version = "0.1.0"
description = "Grounded research video pipeline via Telegram and Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "google-genai>=2.20.0",
    "greenlet>=3.5.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot[all]>=22.8",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

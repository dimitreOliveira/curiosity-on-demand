[project]
name = "curiosity-on-demand"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cairosvg>=2.9.0",
    "codespell>=2.4.3",
    "ffmpeg-python>=0.2.0",
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-texttospeech>=2.37.0",
    "google-genai>=2.19.0",
    "greenlet>=3.5.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot[all]>=22.8",
    "ruff>=0.16.4",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


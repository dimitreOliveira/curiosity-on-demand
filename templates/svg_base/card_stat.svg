<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Grid Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Main Central Card -->
  <rect x="260" y="200" width="1400" height="680" rx="32" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3" opacity="0.95" />

  <!-- Badge -->
  <rect x="340" y="280" width="280" height="48" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="480" y="312" fill="#38bdf8" font-size="20" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="2">KEY METRIC</text>

  <!-- Big Statistic / Number -->
  <text x="960" y="550" fill="url(#accentGrad)" font-size="120" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-2">
    10,000,000×
  </text>

  <!-- Primary Headline -->
  <text x="960" y="680" fill="#f8fafc" font-size="44" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">
    Exponential Computational Advantage
  </text>

  <!-- Subtitle -->
  <text x="960" y="760" fill="#94a3b8" font-size="26" font-family="system-ui, sans-serif" text-anchor="middle">
    Calculations completed in seconds rather than millennia
  </text>
</svg>
